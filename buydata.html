<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Buy Data - AmanData</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui2.css">
    <link rel="stylesheet" href="buydata.css">
</head>
<body>
    <div class="app-container bd-app" id="appContainer">
        <header>
            <button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
            <img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData Logo">
            <span class="header-spacer"></span>
        </header>

        <section class="bd-hero">
            <div class="bd-hero-text">
                <span class="bd-hello">Hello, <strong id="userName">User</strong></span>
                <span class="bd-hero-title">Buy Data</span>
            </div>
            <div class="bd-wallet">
                <span class="bd-wallet-label">Wallet</span>
                <strong class="bd-wallet-amount">₦<span id="sumBalance">0.00</span></strong>
            </div>
        </section>

        <section class="bd-tabs" id="filterTabs"></section>

        <section class="bd-block">
            <h2 class="bd-step"><span class="bd-step-no">1</span>Network</h2>
            <div class="bd-nets" id="netRow"></div>
        </section>

        <section class="bd-block">
            <h2 class="bd-step"><span class="bd-step-no">2</span>Plan type</h2>
            <div class="bd-pills" id="typeRow"></div>
        </section>

        <section class="bd-block">
            <h2 class="bd-step"><span class="bd-step-no">3</span>Validity</h2>
            <div class="bd-pills" id="dayRow"></div>
        </section>

        <section class="bd-block">
            <h2 class="bd-step"><span class="bd-step-no">4</span>Choose plan</h2>
            <main class="bd-plans" id="planList"></main>
        </section>

        <section class="form-card hidden" id="buyForm">
            <h3 class="form-title">Buy Data</h3>
            <div class="detail-rows">
                <div class="detail-row"><span class="detail-row-label">Network</span><span class="detail-row-val" id="fNetwork">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Type</span><span class="detail-row-val" id="fType">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Plan</span><span class="detail-row-val" id="fPlan">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Validity</span><span class="detail-row-val" id="fDay">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Amount</span><span class="detail-row-val" id="fPrice">-</span></div>
            </div>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="13" placeholder="08012345678" autocomplete="off">
            </div>
            <div class="field">
                <label>Transaction PIN</label>
                <div class="pin-row" id="pinRow"></div>
            </div>
            <button type="button" class="btn-primary" id="btnBuy" hidden>Buy Now</button>
        </section>
    </div>

    <script type="module" src="buydata.js"></script>
    <script src="formpopup.js" defer></script>
</body>
</html>
