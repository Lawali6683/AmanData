<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buy Data - AmanData</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui.css">
    
   
       
</head>
<body>
    <div class="app-container" id="appContainer">
        <header>
            <button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
            <img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData Logo">
            <span class="header-spacer"></span>
        </header>

        <p class="hello">Hello, <strong id="userName">User</strong></p>

        <section class="summary-card">
            <div class="summary-label">Wallet Balance</div>
            <div class="summary-balance">₦<span id="sumBalance">0.00</span></div>
        </section>

        <section class="filter-tabs">
            <button type="button" class="tab-btn active" id="tabEasy"><i class="fa-solid fa-bolt"></i> Easy Power Plan</button>
            <button type="button" class="tab-btn" id="tabSimple"><i class="fa-solid fa-layer-group"></i> Simple Plan</button>
        </section>

        <div class="net-row" id="netRow"></div>
        <main class="history-list" id="planList"></main>

        <section class="form-card hidden" id="buyForm">
            <h3 class="form-title">Buy Data</h3>
            <div class="detail-rows">
                <div class="detail-row"><span class="detail-row-label">Network</span><span class="detail-row-val" id="fNetwork">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Plan</span><span class="detail-row-val" id="fPlan">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Validity</span><span class="detail-row-val" id="fDay">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Amount</span><span class="detail-row-val" id="fPrice">-</span></div>
            </div>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="13" placeholder="08012345678" autocomplete="off">
            </div>
            <div class="field">
                <label>Transaction PIN</label>
                <div class="pin-row" id="pinRow"></div>
            </div>
            <button type="button" class="btn-primary" id="btnBuy" hidden>Buy Now</button>
        </section>
    </div>

    <script type="module" src="buydata.js"></script>
</body>
</html>
