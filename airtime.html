<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buy Airtime - AmanData</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <header>
            <button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
            <img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData Logo">
            <span class="header-spacer"></span>
        </header>

        <p class="hello">Hello, <strong id="userName">User</strong></p>

        <section class="summary-card">
            <div class="summary-label">Wallet Balance</div>
            <div class="summary-balance">₦<span id="sumBalance">0.00</span></div>
        </section>

        <div class="net-grid" id="netGrid"></div>

        <section class="form-card hidden" id="buyForm">
            <h3 class="form-title">Buy Airtime</h3>
            <div class="detail-rows">
                <div class="detail-row"><span class="detail-row-label">Network</span><span class="detail-row-val" id="fNetwork">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Amount</span><span class="detail-row-val" id="fAmount">-</span></div>
            </div>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="13" placeholder="08012345678" autocomplete="off">
            </div>
            <div class="field">
                <label for="amount">Amount (₦50 - ₦50,000)</label>
                <input class="input" id="amount" type="tel" inputmode="numeric" maxlength="5" placeholder="500" autocomplete="off">
                <div class="amount-row" id="quickRow"></div>
            </div>
            <div class="field">
                <label>Transaction PIN</label>
                <div class="pin-row" id="pinRow"></div>
            </div>
            <button type="button" class="btn-primary" id="btnBuy" hidden>Buy Airtime</button>
        </section>
    </div>
    <script type="module" src="airtime.js"></script>
</body>
</html>
