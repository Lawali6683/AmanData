        body {
            background: #001233;

            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: radial-gradient(circle at top, #002b75 0%, rgba(0,18,51,0) 70%);
            z-index: 1;
        }

        .page-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;

            display: flex;

        }

            font-weight: 600;
            color: #64748b;

            cursor: pointer;
            transition: all 0.3s ease;

        .input-group {

        .input-label {

            right: 16px;

            padding: 4px;

        .forgot-link-wrap {

        .toast-box {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            background: #1e293b;
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);

        .toast-msg {

            font-weight: 500;

            line-height: 1.4;

        .loader-overlay {
            position: fixed;

            background: #001233;

            flex-direction: column;

            top: 40%;

        }

        .liquid-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 0%;
            background: linear-gradient(180deg, #0066ff 0%, #0033aa 100%);
            transition: height 1.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .liquid-wave {
            position: absolute;
            top: -40px;
            left: 0;
            right: 0;
            height: 80px;
            width: 200%;
        }

        .liquid-wave svg {
            width: 100%;
            height: 100%;
        }

        .liquid-wave path {
            fill: #0066ff;
        }

        .wave-fast {
            animation: moveWave 3s linear infinite;
        }

        .wave-slow {
            animation: moveWave 5s linear infinite reverse;
            opacity: 0.5;
        }

        @keyframes moveWave {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .status-txt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);

            color: #ffffff;
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: 500;
            text-transform: uppercase;

        .status-txt span:nth-child(2) { animation-delay: 0.2s; }
        .status-txt span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulseDot {
            0%, 60%, 100% { opacity: 0.2; }
            30% { opacity: 1; }
        }

        @media (min-width: 768px) {
            body {
                padding: 40px 0;
            }

                border-radius: 24px;

    (function() {
    const widget = document.getElementById('pd-whatsapp-widget');

        isDragging = true;
        
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

        const rect = widget.getBoundingClientRect();
        initialX = rect.left;
        initialY = rect.top;

        startX = clientX;
        startY = clientY;
    }

    function drag(e) {
        if (!isDragging) return;
        
        if (e.cancelable) {
            e.preventDefault();
        }

        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        const dx = clientX - startX;
        const dy = clientY - startY;

        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            hasMoved = true;
        }

        let newX = initialX + dx;
        let newY = initialY + dy;

        const widgetWidth = widget.offsetWidth;
        const widgetHeight = widget.offsetHeight;
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        if (newX < 10) newX = 10;
        if (newX > windowWidth - widgetWidth - 10) newX = windowWidth - widgetWidth - 10;
        if (newY < 10) newY = 10;
        if (newY > windowHeight - widgetHeight - 10) newY = windowHeight - widgetHeight - 10;

        widget.style.left = `${newX}px`;
        widget.style.top = `${newY}px`;
        widget.style.bottom = 'auto';
        widget.style.right = 'auto';
    }

    function dragEnd() {
        isDragging = false;
    }
})();
    
</script>
