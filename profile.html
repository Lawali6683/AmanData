<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Profile - AmanData</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui.css">
    
    
</head>
<body>

    <div class="scene" id="scene">
        <div class="bg" id="bg"></div>
        <img src="image/logo.png" class="loader-logo" id="loaderLogo" alt="Logo">
        <div class="liquid" id="liquid">
            <div class="wave wave-1">
                <svg viewBox="0 0 1200 80" preserveAspectRatio="none">
                    <path d="M0,40 C200,80 400,0 600,40 C800,80 1000,0 1200,40 L1200,80 L0,80 Z"></path>
                </svg>
            </div>
            <div class="wave wave-2">
                <svg viewBox="0 0 1200 80" preserveAspectRatio="none">
                    <path d="M0,40 C200,80 400,0 600,40 C800,80 1000,0 1200,40 L1200,80 L0,80 Z"></path>
                </svg>
            </div>
        </div>
    </div>

    <div class="brand" id="brand">
        Loading<span class="bdot">.</span><span class="bdot">.</span><span class="bdot">.</span>
    </div>

    <div class="app-container" id="appContainer">
       <header>
            <button type="button" class="btn-back" id="btnBack" aria-label="Back" onclick="history.back()">
  <i class="fa-solid fa-arrow-left"></i>
</button>
            <img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData Logo">
            <span class="header-spacer"></span>
        </header>

        <section class="profile-card">
           
            <h2 class="user-name-title" id="profileName">Loading User...</h2>
            <span class="user-badge" id="profileLocation">Active User</span>

            <div class="details-list">
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-regular fa-envelope"></i> Email</div>
                    <div class="detail-value" id="profileEmail">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-solid fa-phone"></i> Phone Number</div>
                    <div class="detail-value" id="profilePhone">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-regular fa-calendar"></i> Joined Date</div>
                    <div class="detail-value" id="profileJoined">---</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label"><i class="fa-solid fa-user-group"></i> Referred By</div>
                    <div class="detail-value" id="profileReferredBy">None</div>
                </div>
            </div>
        </section>

        <section class="management-card">
            <h3 class="card-heading">Security Credentials</h3>
            
            <button class="btn-action" id="btnTriggerPin">
                <div>
                    <i class="fa-solid fa-key" style="color: var(--accent);"></i>
                    <span>Change Transaction PIN</span>
                </div>
                <i class="fa-solid fa-chevron-right indicator"></i>
            </button>

            <button class="btn-action" id="btnTriggerPassword">
                <div>
                    <i class="fa-solid fa-lock" style="color: var(--primary);"></i>
                    <span>Change Login Password</span>
                </div>
                <i class="fa-solid fa-chevron-right indicator"></i>
            </button>
        </section>
    </div>

    <div class="overlay-form" id="pinVerificationOverlay">
        <div class="form-card" id="pinFormCard">
            <div class="form-header">
                <h3 class="form-title" id="pinFormTitle">Identity Verification</h3>
                <button class="btn-close-form" id="btnClosePinForm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="input-wrapper">
                <span class="form-label">Email Address</span>
                <input type="email" class="input-control" id="pinEmailInput" placeholder="Enter your email">
            </div>

            <div class="input-wrapper">
                <span class="form-label">Account Password</span>
                <input type="password" class="input-control" id="pinPassInput" placeholder="Enter password">
                <i class="fa-regular fa-eye toggle-password" id="togglePinPass"></i>
            </div>

            <button class="btn-submit" id="btnSubmitPinVerify">Submit Verification</button>
        </div>
    </div>

    <div class="overlay-form" id="passwordVerificationOverlay">
        <div class="form-card" id="passwordFormCard">
            <div class="form-header">
                <h3 class="form-title" id="passwordFormTitle">Security Credentials</h3>
                <button class="btn-close-form" id="btnClosePassForm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="passwordStep1Fields" style="display: flex; flex-direction: column; gap: 20px; width: 100%;">
                <div class="input-wrapper">
                    <span class="form-label">Email Address</span>
                    <input type="email" class="input-control" id="passEmailInput" placeholder="Enter your email">
                </div>

                <div class="input-wrapper">
                    <span class="form-label">Current Password</span>
                    <input type="password" class="input-control" id="passOldInput" placeholder="Enter current password">
                    <i class="fa-regular fa-eye toggle-password" id="togglePassOld"></i>
                </div>

                <div class="forget-link-wrapper">
                    <a href="forget.html" class="forget-link">Forgot Password?</a>
                </div>

                <button class="btn-submit" id="btnSubmitPassVerify">Verify Account</button>
            </div>

            <div id="passwordStep2Fields" style="display: none; flex-direction: column; gap: 20px; width: 100%;">
                <div class="input-wrapper">
                    <span class="form-label">New Password</span>
                    <input type="password" class="input-control" id="passNewInput" placeholder="Enter new password">
                    <i class="fa-regular fa-eye toggle-password" id="togglePassNew"></i>
                </div>

                <div class="input-wrapper">
                    <span class="form-label">Confirm New Password</span>
                    <input type="password" class="input-control" id="passConfirmInput" placeholder="Confirm new password">
                    <i class="fa-regular fa-eye toggle-password" id="togglePassConfirm"></i>
                </div>

                <button class="btn-submit" id="btnSubmitPassChange">Change Password</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer">
        <i class="fa-solid fa-circle-check toast-icon success" id="toastIcon"></i>
        <span class="toast-message" id="toastMessage">Success</span>
    </div>

   
    
    <div id="pd-whatsapp-widget" class="pd-wa-container">
    <div class="pd-wa-pulse-ring"></div>
    <a href="https://wa.me/2347060739494?text=I%20am%20in%20need%20of%20help%20from%20the%20AmanData%20app" 
       target="_blank" 
       class="pd-wa-link" 
       id="pd-wa-link"
       draggable="false">
        <img src="image/whatsapp.png" alt="WhatsApp Support" class="pd-wa-icon" draggable="false">
    </a>
</div>

<style>
    .pd-wa-container {
        position: fixed;
        bottom: 270px;
        right: 24px;
        width: 60px;
        height: 60px;
        z-index: 9;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-drag: none;
        touch-action: none;
    }
Dan u   .pd-wa-container:active {
        cursor: grabbing;
    }

    .pd-wa-link {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        
        box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        -webkit-user-drag: none;
    }

    .pd-wa-link:active {
        transform: scale(0.9);
    }

    .pd-wa-icon {
        width: 60px;
        height: 60px;
        object-fit: contain;
        pointer-events: none;
        animation: pd-wa-bounce 3s ease-in-out infinite;
    }

    .pd-wa-pulse-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background-color: #25d366;
        opacity: 0.4;
        z-index: -1;
        animation: pd-wa-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        pointer-events: none;
    }

    @keyframes pd-wa-ping {
        75%, 100% {
            transform: scale(1.6);
            opacity: 0;
        }
    }

    @keyframes pd-wa-bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-5px);
        }
    }
</style>

<script>
    
    (function() {
    const widget = document.getElementById('pd-whatsapp-widget');
    const link = document.getElementById('pd-wa-link');
    
    let isDragging = false;
    let startX, startY;
    let initialX, initialY;
    let hasMoved = false;

    widget.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);

    widget.addEventListener('touchstart', dragStart, { passive: false });
    document.addEventListener('touchmove', drag, { passive: false });
    document.addEventListener('touchend', dragEnd);

    link.addEventListener('click', function(e) {
        if (hasMoved) {
            e.preventDefault();
        }
    });

    function dragStart(e) {
        hasMoved = false;
        isDragging = true;
        
        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

        const rect = widget.getBoundingClientRect();
        initialX = rect.left;
        initialY = rect.top;

        startX = clientX;
        startY = clientY;
    }

    function drag(e) {
        if (!isDragging) return;
        
        if (e.cancelable) {
            e.preventDefault();
        }

        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        const dx = clientX - startX;
        const dy = clientY - startY;

        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            hasMoved = true;
        }

        let newX = initialX + dx;
        let newY = initialY + dy;

        const widgetWidth = widget.offsetWidth;
        const widgetHeight = widget.offsetHeight;
        const windowWidth = window.innerWidth;
        const windowHeight = window.innerHeight;

        if (newX < 10) newX = 10;
        if (newX > windowWidth - widgetWidth - 10) newX = windowWidth - widgetWidth - 10;
        if (newY < 10) newY = 10;
        if (newY > windowHeight - widgetHeight - 10) newY = windowHeight - widgetHeight - 10;

        widget.style.left = `${newX}px`;
        widget.style.top = `${newY}px`;
        widget.style.bottom = 'auto';
        widget.style.right = 'auto';
    }

    function dragEnd() {
        isDragging = false;
    }
})();

document.getElementById('btnBack').addEventListener('click', function() {
  window.location.href = 'dashboard.html';
});
    
</script>

     <script type="module" src="profile.js"></script>
   . 
</body>
</html>
