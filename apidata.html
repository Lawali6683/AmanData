<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>API data - AmanData</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="uix.css">
<script>
window.addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&t.tagName!=='SCRIPT')return;var m=t&&t.src?'A file this page needs could not be loaded. Check the file names and that every file is uploaded.':(e.message||'Page error');var b=document.createElement('div');b.setAttribute('role','alert');b.style.cssText='position:fixed;top:12px;left:12px;right:12px;z-index:10050;background:#1e293b;border:1px solid #ef4444;color:#f8fafc;padding:14px 16px;border-radius:14px;font:14px -apple-system,sans-serif';b.textContent=m;document.body.appendChild(b);},true);
</script>
</head>
<body>
<div class="app-container" id="appContainer">
<header><button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData"><button type="button" class="btn-back" id="btnRefresh" aria-label="Refresh"><i class="fa-solid fa-rotate"></i></button></header>
<section class="summary-card"><div class="summary-label">Provider plans</div><div class="summary-balance"><span id="planCount">0</span> items</div></section>
<section class="filter-tabs">
<button type="button" class="tab-btn active" id="tabData"><i class="fa-solid fa-wifi"></i> Data</button>
<button type="button" class="tab-btn" id="tabCable"><i class="fa-solid fa-tv"></i> Cable</button>
<button type="button" class="tab-btn" id="tabExam"><i class="fa-solid fa-graduation-cap"></i> Exam</button>
</section>
<div class="net-row" id="netRow"></div>
<section class="form-card">
<h3 class="form-title">Add profit to every plan</h3>
<div class="bulk-row"><input class="input" id="bulkInput" type="number" inputmode="decimal" min="0" step="1" placeholder="Amount in ₦"><button type="button" class="btn-small" id="btnApply">Apply</button></div>
<button type="button" class="btn-small alt" id="btnSaveAll">Save all in this network</button>
</section>
<main class="history-list" id="planList"></main>
</div>
<script type="module" src="apidata.js"></script>
</body>
</html>
