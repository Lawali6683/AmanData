<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Airtime and electricity - AmanData</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="uix.css">
<script>
window.addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&t.tagName!=='SCRIPT')return;var m=t&&t.src?'A file this page needs could not be loaded. Check the file names and that every file is uploaded.':(e.message||'Page error');var b=document.createElement('div');b.setAttribute('role','alert');b.style.cssText='position:fixed;top:12px;left:12px;right:12px;z-index:10050;background:#1e293b;border:1px solid #ef4444;color:#f8fafc;padding:14px 16px;border-radius:14px;font:14px -apple-system,sans-serif';b.textContent=m;document.body.appendChild(b);},true);
</script>
</head>
<body>
<div class="app-container" id="appContainer">
<header><button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData"><button type="button" class="btn-back" id="btnRefresh" aria-label="Refresh"><i class="fa-solid fa-rotate"></i></button></header>
<section class="summary-card"><div class="summary-label">Items you sell</div><div class="summary-balance"><span id="itemCount">0</span> items</div></section>
<section class="filter-tabs two">
<button type="button" class="tab-btn active" id="tabAirtime"><i class="fa-solid fa-mobile-screen"></i> Airtime</button>
<button type="button" class="tab-btn" id="tabElectricity"><i class="fa-solid fa-bolt"></i> Electricity</button>
</section>
<section class="form-card">
<h3 class="form-title">Profit added to every item</h3>
<p class="form-desc">The user pays the amount they choose plus this profit. Use 0 to charge no extra.</p>
<div class="bulk-row"><select class="input" id="bulkMode"><option value="percent">Percent %</option><option value="fixed">Fixed ₦</option></select><input class="input" id="bulkValue" type="number" inputmode="decimal" min="0" step="0.5" placeholder="Value"><button type="button" class="btn-small" id="btnApply">Apply</button></div>
<button type="button" class="btn-small alt" id="btnSaveAll">Save all in this tab</button>
</section>
<main class="history-list" id="itemList"></main>
</div>
<script type="module" src="apibills.js"></script>
</body>
</html>
