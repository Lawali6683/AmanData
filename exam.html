<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Education - AmanData</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui.css">
               
    
</head>
<body>
    <div class="app-container" id="appContainer">
        <header>
            <button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
            <img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData Logo">
            <span class="header-spacer"></span>
        </header>

        <p class="hello">Hello, <strong id="userName">User</strong></p>

        <section class="summary-card">
            <div class="summary-label">Wallet Balance</div>
            <div class="summary-balance">₦<span id="sumBalance">0.00</span></div>
        </section>

        <section class="form-card hidden" id="resultCard">
            <h3 class="form-title">Purchase Successful</h3>
            <p class="empty-desc" id="resultMsg"></p>
            <div class="history-list" id="pinList"></div>
            <button type="button" class="btn-primary" id="btnCopyAll"><i class="fa-solid fa-copy"></i> Copy All</button>
            <button type="button" class="link-btn" id="btnCloseResult">Close</button>
        </section>

        <div class="net-grid" id="examGrid"></div>
        <main class="history-list" id="itemList"></main>

        <section class="form-card hidden" id="buyForm">
            <h3 class="form-title">Buy Result Checker</h3>
            <div class="detail-rows">
                <div class="detail-row"><span class="detail-row-label">Exam</span><span class="detail-row-val" id="fExam">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Unit Price</span><span class="detail-row-val" id="fUnit">-</span></div>
                <div class="detail-row"><span class="detail-row-label">Total</span><span class="detail-row-val" id="fTotal">-</span></div>
            </div>
            <div class="field" id="qtyField">
                <label for="qty">Quantity (1 - 10)</label>
                <input class="input" id="qty" type="tel" inputmode="numeric" maxlength="2" value="1" autocomplete="off">
            </div>
            <div class="field hidden" id="profField">
                <label for="profile">JAMB Profile Code</label>
                <div class="bulk-row">
                    <input class="input" id="profile" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digits" autocomplete="off">
                    <button type="button" class="btn-small" id="btnVerify">Verify</button>
                </div>
                <div class="detail-row hidden" id="candRow"><span class="detail-row-label">Candidate</span><span class="detail-row-val good" id="candName">-</span></div>
            </div>
            <div class="field">
                <label for="phone">Phone Number (optional)</label>
                <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="13" placeholder="08012345678" autocomplete="off">
            </div>
            <div class="field">
                <label>Transaction PIN</label>
                <div class="pin-row" id="pinRow"></div>
            </div>
            <button type="button" class="btn-primary" id="btnBuy" hidden>Buy Now</button>
        </section>
    </div>
    <script type="module" src="education.js"></script>
</body>
</html>
