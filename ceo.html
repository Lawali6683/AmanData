<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Users - AmanData</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="uix.css">
</head>
<body>
<div class="app-container wide" id="appContainer">
<header><button type="button" class="btn-back" id="btnBack" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><img src="https://i.imgur.com/bNK9ccG.png" class="page-logo" alt="AmanData"><button type="button" class="btn-back" id="btnRefresh" aria-label="Refresh"><i class="fa-solid fa-rotate"></i></button></header>
<section class="stats-grid four">
<div class="stat-card"><div class="stat-label">Total registered</div><div class="stat-value" id="statTotal">0</div></div>
<div class="stat-card"><div class="stat-label">Total wallet money</div><div class="stat-value good" id="statMoney">₦0.00</div></div>
<div class="stat-card"><div class="stat-label">Users with money</div><div class="stat-value" id="statFunded">0</div></div>
<div class="stat-card"><div class="stat-label">Users without money</div><div class="stat-value muted" id="statEmpty">0</div></div>
</section>
<section class="form-card">
<h3 class="form-title">Find a user</h3>
<input class="input" id="searchInput" type="search" autocomplete="off" placeholder="Type a name, email or phone number">
<p class="form-desc" id="searchInfo"></p>
</section>
<main class="user-list" id="userList"></main>
</div>
<div class="sheet-overlay" id="sheetOverlay">
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
<div class="sheet-head"><h3 class="form-title" id="sheetTitle">User</h3><button type="button" class="close-btn" id="btnClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
<div id="sheetBody"></div>
</div>
</div>
<script type="module" src="ceo.js"></script>
</body>
</html>
